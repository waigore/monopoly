# Squash-merge into main after the required trigger-automerge check passes.
# Runs from main via workflow_run so it never checks out PR code.
#
# Auto-merge cannot be armed from this workflow: the job itself is a
# non-required check, which makes the PR UNSTABLE, and GitHub rejects
# enablePullRequestAutoMerge in that state.
name: enable-automerge

on:
  workflow_run:
    workflows: [trigger-automerge]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    name: enable-automerge
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main \
              --json number,headRefOid --jq ".[] | select(.headRefOid==\"$HEAD_SHA\") | .number")
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR into main for $HEAD_SHA"
            exit 0
          fi

          meta=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft,baseRefName,state)
          echo "$meta"
          echo "$meta" | jq -e '.state=="OPEN" and .isDraft==false and .baseRefName=="main"' >/dev/null

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash
