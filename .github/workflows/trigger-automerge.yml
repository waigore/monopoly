# Always-passing required check. Main requires it; enable-automerge
# squash-merges once this job succeeds. Keep this job last: any other
# gate that must pass before merge should use needs: so it finishes
# before this job runs. See docs/workflow/main.md.
name: trigger-automerge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  trigger-automerge:
    name: trigger-automerge
    runs-on: ubuntu-latest
    steps:
      - name: Pass
        run: "true"
