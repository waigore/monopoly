# Always-passing required check. Main requires it so a pull request can
# merge once this job succeeds.
name: trigger-automerge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  trigger-automerge:
    name: trigger-automerge
    runs-on: ubuntu-latest
    steps:
      - name: Pass
        run: "true"
